name: Security

# Launch task T05: reports first. CodeQL, the dependency audits and a secret scan run on every pull request
# into v2, on pushes to v2, weekly, and on demand. The two dependency audits are report-only for now
# (continue-on-error, results in the job summary) because the first run found issues that have their own
# tasks; they become blocking at the launch freeze (T49). CodeQL and the secret scan fail the job.

on:
  pull_request:
    branches: [v2, main]
  push:
    branches: [v2]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  pip-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit (report only)
        continue-on-error: true
        working-directory: webapp/backend
        run: |
          pip install pip-audit
          set -o pipefail
          status=0
          pip-audit -r requirements.txt --progress-spinner off 2>&1 | tee /tmp/pip-audit.txt || status=$?
          { echo "### pip-audit"; echo '```'; cat /tmp/pip-audit.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status

  npm-audit:
    name: npm dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: npm audit, high and critical (report only)
        continue-on-error: true
        working-directory: webapp/frontend
        run: |
          set -o pipefail
          status=0
          npm audit --omit=dev --audit-level=high 2>&1 | tee /tmp/npm-audit.txt || status=$?
          { echo "### npm audit (production dependencies, high and above)"; echo '```'; cat /tmp/npm-audit.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status

  secrets:
    name: Secret scan (whole history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
