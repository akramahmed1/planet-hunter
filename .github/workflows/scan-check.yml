name: Scan check

# Phase 6 "done when": rescanning TOI 700 with the scan engine must reproduce the
# recorded validation (validate_toi700.py: 16.0509 days) within 0.01%. Runs the real
# scan (MAST download, BLS, vetting, live cross-match) on GitHub's machines, since the
# build sessions cannot reach MAST.
on:
  workflow_dispatch:
  push:
    branches: [v2, "v2-p6*"]
    paths:
      - webapp/backend/pipeline/**
      - webapp/backend/scans/**
      - .github/workflows/scan-check.yml

jobs:
  rescan-toi-700:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: webapp/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: webapp/backend/requirements*.txt
      - run: pip install -r requirements.txt
      - name: Rescan TOI 700 (validation preset) and compare
        run: |
          python - <<'PY'
          import json, sys
          from scans import catalogs, run
          rec = json.load(open("data/results.json"))["validation"]
          result, signal = run.scan(150428135, run.PRESETS["validation"], print, catalogs.LiveCatalogs())
          err = abs(signal["period_d"] - rec["recovered_period_d"]) / rec["recovered_period_d"]
          print(json.dumps({k: v for k, v in signal.items() if k != "vetting"}, indent=1, default=str))
          for row in signal["vetting"]:
              print(f"{row['id']:10} {row['status']:7} {row['explanation']}")
          print(f"recorded {rec['recovered_period_d']} d, rescan {signal['period_d']} d, error {err * 100:.4f}%")
          assert result["sectors"], "no sectors"
          assert err <= 1e-4, "rescan does not reproduce the recorded validation within 0.01%"
          assert signal["proposed_label"] == "known_planet", signal["crossmatch"]
          print("OK: reproduces the recorded validation and matches TOI-700 c")
          PY

  # Item 5 of the launch-readiness brief: a long baseline must not smear the transits. The standard
  # preset takes up to 4 sectors of TOI 270 (TIC 259377017), spread over two years.
  rescan-toi-270:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: webapp/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: webapp/backend/requirements*.txt
      - run: pip install -r requirements.txt
      - name: Rescan TOI 270 (standard preset, several sectors) and compare to the batch scan
        run: |
          python - <<'PY'
          import json
          from scans import catalogs, run
          batch = next(c for c in json.load(open("data/results.json"))["candidates"] if c["slug"] == "toi-270")
          result, signal = run.scan(259377017, run.PRESETS["standard"], print, catalogs.LiveCatalogs())
          print(json.dumps({k: v for k, v in signal.items() if k != "vetting"}, indent=1, default=str))
          print("sectors", result["sectors"], "|", result["periodogram"]["method"])
          assert abs(signal["period_d"] - 5.6605) <= 0.0005, f"period {signal['period_d']} is not within 0.0005 d of 5.6605"
          assert abs(signal["depth_ppm"] - batch["depth_ppm"]) / batch["depth_ppm"] <= 0.2, \
              f"depth {signal['depth_ppm']} ppm is not within 20% of the batch {batch['depth_ppm']} ppm"
          assert signal["snr"] > 15, f"SNR {signal['snr']} is not above 15"
          print("OK: long-baseline rescan matches the catalog period and the batch depth")
          PY
