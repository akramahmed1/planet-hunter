name: Scan check

# Phase 6 "done when": rescanning TOI 700 with the scan engine must reproduce the
# recorded validation (validate_toi700.py: 16.0509 days) within 0.01%. Runs the real
# scan (MAST download, BLS, vetting, live cross-match) on GitHub's machines, since the
# build sessions cannot reach MAST.
on:
  workflow_dispatch:
  push:
    branches: [v2, "v2-p6*"]
    paths:
      - webapp/backend/pipeline/**
      - webapp/backend/scans/**
      - .github/workflows/scan-check.yml

jobs:
  rescan-toi-700:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: webapp/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: webapp/backend/requirements*.txt
      - run: pip install -r requirements.txt
      - name: Rescan TOI 700 (validation preset) and compare
        run: |
          python - <<'PY'
          import json, sys
          from scans import catalogs, run
          rec = json.load(open("data/results.json"))["validation"]
          result, signal = run.scan(150428135, run.PRESETS["validation"], print, catalogs.LiveCatalogs())
          err = abs(signal["period_d"] - rec["recovered_period_d"]) / rec["recovered_period_d"]
          print(json.dumps({k: v for k, v in signal.items() if k != "vetting"}, indent=1, default=str))
          for row in signal["vetting"]:
              print(f"{row['id']:10} {row['status']:7} {row['explanation']}")
          print(f"recorded {rec['recovered_period_d']} d, rescan {signal['period_d']} d, error {err * 100:.4f}%")
          assert result["sectors"], "no sectors"
          assert err <= 1e-4, "rescan does not reproduce the recorded validation within 0.01%"
          assert signal["proposed_label"] == "known_planet", signal["crossmatch"]
          print("OK: reproduces the recorded validation and matches TOI-700 c")
          PY

  # Item 5 of the launch-readiness brief: a long baseline must not smear the transits. The standard
  # preset takes up to 4 sectors of TOI 270 (TIC 259377017), spread over two years.
  rescan-toi-270:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: webapp/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: webapp/backend/requirements*.txt
      - run: pip install -r requirements.txt
      - name: Rescan TOI 270 (standard preset, several sectors) and compare to the batch scan
        run: |
          python - <<'PY'
          import json
          from scans import catalogs, run
          batch = next(c for c in json.load(open("data/results.json"))["candidates"] if c["slug"] == "toi-270")
          result, signal = run.scan(259377017, run.PRESETS["standard"], print, catalogs.LiveCatalogs())
          print(json.dumps({k: v for k, v in signal.items() if k != "vetting"}, indent=1, default=str))
          print("sectors", result["sectors"], "|", result["periodogram"]["method"])
          assert abs(signal["period_d"] - 5.6605) <= 0.0005, f"period {signal['period_d']} is not within 0.0005 d of 5.6605"
          assert abs(signal["depth_ppm"] - batch["depth_ppm"]) / batch["depth_ppm"] <= 0.2, \
              f"depth {signal['depth_ppm']} ppm is not within 20% of the batch {batch['depth_ppm']} ppm"
          assert signal["snr"] > 15, f"SNR {signal['snr']} is not above 15"
          print("OK: long-baseline rescan matches the catalog period and the batch depth")
          PY

  diag-toi-270:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    defaults:
      run:
        working-directory: webapp/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: webapp/backend/requirements*.txt
      - run: pip install -r requirements.txt
      - name: Why does the long-baseline TOI 270 scan lose depth and SNR?
        run: |
          python - <<'PY'
          import numpy as np
          from astropy.timeseries import BoxLeastSquares
          from lightkurve import search_lightcurve
          from pipeline.core import bls_snr
          sr = search_lightcurve("TIC 259377017", mission="TESS", author="SPOC")
          print(sr.table[["sequence_number", "exptime", "author"]])
          picked = sr[:4]
          print("PICKED", list(zip(picked.table["sequence_number"], picked.table["exptime"])))
          lcs = picked.download_all()
          def bls_at(t, f, label, p0=5.6605, w=0.01):
              periods = np.linspace(p0 - w, p0 + w, 4001)
              r = BoxLeastSquares(t, f).power(periods, np.linspace(0.04, 0.15, 8), oversample=20)
              k = int(np.argmax(r.power))
              p, d, t0 = float(r.period[k]), float(r.duration[k]), float(r.transit_time[k])
              print(f"{label:34} P={p:.5f} dur={d:.3f} depth={r.depth[k]*1e6:7.0f} ppm snr={bls_snr(t, f, p, d, t0):5.1f} n={len(t)}")
              return p, d, t0
          for lc in lcs:
              print("sector", lc.meta.get("SECTOR"), "exptime", lc.meta.get("EXPOSURE"), "n", len(lc))
          def build(sel, window=None):
              parts = []
              for lc in sel:
                  l = lc.remove_nans().normalize()
                  n = window or 1001
                  parts.append(l.flatten(window_length=n))
              import lightkurve as lk
              c = lk.LightCurveCollection(parts).stitch().remove_outliers(sigma=5)
              return c.time.value, c.flux.value
          secs = [lc.meta.get("SECTOR") for lc in lcs]
          # A: what the scan does (one window of 1001 cadences for everything)
          t, f = build(lcs)
          bls_at(t, f, "A all sectors, window=1001 cadences")
          # B: window scaled to about 33 hours whatever the cadence
          parts = []
          import lightkurve as lk
          for lc in lcs:
              l = lc.remove_nans().normalize()
              cad = np.median(np.diff(l.time.value)) * 24 * 3600
              w = int(33 * 3600 / cad) | 1
              print("sector", lc.meta.get("SECTOR"), "cadence s", round(cad, 1), "window", w)
              parts.append(l.flatten(window_length=w))
          c = lk.LightCurveCollection(parts).stitch().remove_outliers(sigma=5)
          tb, fb = c.time.value, c.flux.value
          bls_at(tb, fb, "B all sectors, window=33 h")
          # C: subsets with the fixed (33 h) windows
          for keep in ([3, 4], [3, 4, 5], [30], [3, 30]):
              sel = [p for p, s in zip(parts, secs) if s in keep]
              cc = lk.LightCurveCollection(sel).stitch().remove_outliers(sigma=5)
              bls_at(cc.time.value, cc.flux.value, f"C sectors {keep}, 33 h")
          # D: timing of each sector's transits against the catalog period 5.66051
          P = 5.66051
          for lc, pp in zip(lcs, parts):
              t1, f1 = pp.time.value, pp.flux.value
              best = None
              for off in np.linspace(-0.2, 0.2, 801):
                  pass
              periods = np.array([P])
              r = BoxLeastSquares(t1, f1).power(periods, np.linspace(0.04, 0.15, 8), oversample=50)
              print("sector", lc.meta.get("SECTOR"), "t0", round(float(r.transit_time[0]), 4), "depth ppm", round(float(r.depth[0]) * 1e6))
          PY
