name: CI

# What runs where (agreed with Akram, 2026-10-22):
#  - A pull request into v2 runs every check except that the browser tests are the ones the pull request adds or
#    changes, plus the core list in webapp/frontend/e2e/CORE_SPECS.
#  - Firefox and WebKit run the main flows (e2e/CROSS_BROWSER_SPECS) whenever the full suite runs, and on a pull request
#    that changes their setup.
#  - A pull request that changes webapp/frontend/package.json or package-lock.json runs the full suite too.
#  - The full browser suite and the screenshots run after every merge to v2, on any pull request into main (the
#    release), on a push to main, on a daily schedule once this file is on the default branch, and when started by hand.
on:
  pull_request:
  push:
    branches: [main, v2]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend contract + API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp/backend
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ph_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      # Database tests run against this throwaway Postgres; REQUIRE_DB makes
      # them fail instead of skip if it is ever missing.
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ph_test
      REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: webapp/backend/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Published data is rebuilt from the CSV + annotations
        run: python ../../scripts/build_results.py --check
      - run: python -m pytest -q

  frontend:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: webapp/backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webapp/frontend/package-lock.json
      - run: pip install -r ../backend/requirements.txt
      - run: npm ci
      - name: Generated API types are up to date
        run: |
          npm run gen:types
          git diff --exit-code -- lib/api-types.gen.ts || {
            echo "::error::lib/api-types.gen.ts is stale. Run 'npm run gen:types' and commit the result."
            exit 1
          }
      - run: npm run test:unit
      - run: npm run typecheck
      - run: npm run build
      - name: First-load budget for /solar-system (three.js loads later)
        run: npm run check:budget
        env:
          NEXT_PUBLIC_API_BASE: http://127.0.0.1:8000

  e2e:
    name: End-to-end (backend + frontend + browser)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ph_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ph_e2e
      # Every browser test signs up from 127.0.0.1.
      AUTH_SIGNUPS_PER_HOUR: "1000"
      AUTH_FORGOT_PER_HOUR: "1000"
      # The explainer runs with the deterministic fake model in CI (no key, no cost).
      EXPLAINER_ENABLED: "1"
      EXPLAINER_FAKE: "1"
      # All browser tests write from one address.
      WRITE_LIMIT_PER_MINUTE: "100000"
      # Classroom is OFF by default (production); the browser tests exercise it, so it is on here.
      CLASSROOM_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the changed test files are found by comparing with the base branch
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm # npm ci was taking up to 7 minutes on a cold runner
          cache-dependency-path: webapp/frontend/package-lock.json
      - name: Choose the browser tests for this run
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          deps=no
          if [ "$EVENT" = "pull_request" ] && [ "$BASE" != "main" ]; then
            git fetch --no-tags origin "$BASE"
            # A change to the frontend's packages (a framework upgrade, say) can break anything: run everything.
            if git diff --name-only "origin/$BASE" HEAD | grep -qE '^webapp/frontend/(package\.json|package-lock\.json)$'; then deps=yes; fi
          fi
          if [ "$EVENT" != "pull_request" ] || [ "$BASE" = "main" ] || [ "$deps" = yes ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "cross=1" >> "$GITHUB_OUTPUT"
            echo "Full browser suite ($EVENT, base '$BASE')."
          else
            cd webapp/frontend
            git fetch --no-tags origin "$BASE"
            specs=$( { grep -v '^#' e2e/CORE_SPECS | grep -v '^$'; \
              git diff --name-only "origin/$BASE" HEAD -- 'webapp/frontend/e2e/*.spec.ts' | sed 's#.*/##'; } | sort -u )
            list=""
            for f in $specs; do
              if [ -f "e2e/$f" ]; then list="$list e2e/$f"; else echo "::warning::$f is listed or changed but does not exist (deleted?)"; fi
            done
            echo "mode=subset" >> "$GITHUB_OUTPUT"
            echo "specs=$list" >> "$GITHUB_OUTPUT"
            # Firefox and WebKit run too when this pull request changes how they are set up.
            if git diff --name-only "origin/$BASE" HEAD | grep -qE 'e2e/CROSS_BROWSER_SPECS|playwright.config.ts|\.github/workflows/ci.yml'; then
              echo "cross=1" >> "$GITHUB_OUTPUT"
            fi
            echo "Core and changed browser tests only:$list"
          fi
      - name: Make a throwaway key for two-step sign-in tests
        run: echo "TOTP_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - name: Start backend
        working-directory: webapp/backend
        run: |
          pip install -r requirements.txt
          alembic upgrade head
          # A finished scan (TOI 1338) built offline from saved data, for the scan pages' tests.
          python seed_demo_scans.py
          # Live endpoints answer from the saved real source samples, so this job never depends on NASA uptime.
          PH_OFFLINE_FIXTURES=1 nohup uvicorn app:app --port 8000 > /tmp/backend.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/api/health && break; sleep 1; done
      - name: Build and start frontend
        working-directory: webapp/frontend
        env:
          NEXT_PUBLIC_API_BASE: http://127.0.0.1:8000
        run: |
          npm ci
          npm run build
          # PH_ERROR_TEST lets /error-check throw, so the error page is tested for real (it is a 404 otherwise).
          PH_ERROR_TEST=1 nohup npm run start -- --port 3000 > /tmp/frontend.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:3000 > /dev/null && break; sleep 1; done
      - name: Backend QA suite
        run: python webapp/qa/qa_backend.py http://127.0.0.1:8000
      - name: Frontend QA suite
        run: python webapp/qa/qa_frontend.py http://127.0.0.1:3000 http://127.0.0.1:8000
      # One install for every browser this run needs. The system-package part (apt) is sometimes very slow or stuck on
      # GitHub's runners (10, 13 and then more than 15 minutes in three runs), so each try is cut off after 7 minutes and
      # tried again (up to three times); a stuck download usually succeeds on the second try.
      - name: Install Playwright browsers
        timeout-minutes: 25
        working-directory: webapp/frontend
        run: |
          if [ "${{ steps.pick.outputs.cross }}" = "1" ]; then browsers="chromium firefox webkit"; else browsers="chromium"; fi
          for try in 1 2 3; do
            if timeout 7m npx playwright install --with-deps $browsers; then exit 0; fi
            echo "::warning::browser install try $try did not finish in 7 minutes, trying again"
          done
          echo "::error::the browsers could not be installed in three tries"
          exit 1
      - name: Playwright (phone + desktop, with axe accessibility checks)
        working-directory: webapp/frontend
        run: |
          if [ "${{ steps.pick.outputs.mode }}" = "full" ]; then npx playwright test; else npx playwright test ${{ steps.pick.outputs.specs }}; fi
      - name: Playwright in Firefox and WebKit (the main flows, e2e/CROSS_BROWSER_SPECS)
        if: steps.pick.outputs.cross == '1'
        working-directory: webapp/frontend
        env:
          CROSS_BROWSER: "1"
        run: npx playwright test --project=desktop-firefox --project=desktop-webkit --project=mobile-webkit
      - name: Screenshots (Pixel-class phone 390x844 and laptop 1440x900, every route)
        if: steps.pick.outputs.mode == 'full'
        working-directory: webapp/frontend
        env:
          SCREENSHOTS: "1"
          SHOT_LABEL: ci
        run: npx playwright test --project=screenshots-phone --project=screenshots-laptop
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: webapp/frontend/screenshots
          retention-days: 14
          if-no-files-found: ignore
      - name: Lighthouse mobile budget (accessibility, best practices, page weight)
        working-directory: webapp/frontend
        run: |
          export CHROME_PATH=$(node -e "console.log(require('playwright').chromium.executablePath())")
          npx --yes @lhci/cli@0.14.0 autorun
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: webapp/frontend/playwright-report
          retention-days: 7
      - name: Logs on failure
        if: failure()
        run: tail -n 100 /tmp/backend.log /tmp/frontend.log
