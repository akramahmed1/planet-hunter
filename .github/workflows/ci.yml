name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend contract + API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp/backend
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ph_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      # Database tests run against this throwaway Postgres; REQUIRE_DB makes
      # them fail instead of skip if it is ever missing.
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ph_test
      REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: webapp/backend/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Published data is rebuilt from the CSV + annotations
        run: python ../../scripts/build_results.py --check
      - run: python -m pytest -q

  frontend:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: webapp/backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webapp/frontend/package-lock.json
      - run: pip install -r ../backend/requirements.txt
      - run: npm ci
      - name: Generated API types are up to date
        run: |
          npm run gen:types
          git diff --exit-code -- lib/api-types.gen.ts || {
            echo "::error::lib/api-types.gen.ts is stale. Run 'npm run gen:types' and commit the result."
            exit 1
          }
      - run: npm run test:unit
      - run: npm run typecheck
      - run: npm run build
      - name: First-load budget for /solar-system (three.js loads later)
        run: npm run check:budget
        env:
          NEXT_PUBLIC_API_BASE: http://127.0.0.1:8000

  e2e:
    name: End-to-end (backend + frontend + browser)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ph_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ph_e2e
      # Every browser test signs up from 127.0.0.1.
      AUTH_SIGNUPS_PER_HOUR: "1000"
      # The explainer runs with the deterministic fake model in CI (no key, no cost).
      EXPLAINER_ENABLED: "1"
      EXPLAINER_FAKE: "1"
      # All browser tests write from one address.
      WRITE_LIMIT_PER_MINUTE: "100000"
      # Classroom is OFF by default (production); the browser tests exercise it, so it is on here.
      CLASSROOM_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Start backend
        working-directory: webapp/backend
        run: |
          pip install -r requirements.txt
          alembic upgrade head
          # A finished scan (TOI 1338) built offline from saved data, for the scan pages' tests.
          python seed_demo_scans.py
          # Live endpoints answer from the saved real source samples, so this job never depends on NASA uptime.
          PH_OFFLINE_FIXTURES=1 nohup uvicorn app:app --port 8000 > /tmp/backend.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/api/health && break; sleep 1; done
      - name: Build and start frontend
        working-directory: webapp/frontend
        env:
          NEXT_PUBLIC_API_BASE: http://127.0.0.1:8000
        run: |
          npm ci
          npm run build
          # PH_ERROR_TEST lets /error-check throw, so the error page is tested for real (it is a 404 otherwise).
          PH_ERROR_TEST=1 nohup npm run start -- --port 3000 > /tmp/frontend.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:3000 > /dev/null && break; sleep 1; done
      - name: Backend QA suite
        run: python webapp/qa/qa_backend.py http://127.0.0.1:8000
      - name: Frontend QA suite
        run: python webapp/qa/qa_frontend.py http://127.0.0.1:3000 http://127.0.0.1:8000
      - name: Install Playwright browser
        working-directory: webapp/frontend
        run: npx playwright install --with-deps chromium
      - name: Playwright (phone + desktop, with axe accessibility checks)
        working-directory: webapp/frontend
        run: npx playwright test
      - name: Screenshots (Pixel-class phone 390x844 and laptop 1440x900, every route)
        working-directory: webapp/frontend
        env:
          SCREENSHOTS: "1"
          SHOT_LABEL: ci
        run: npx playwright test --project=screenshots-phone --project=screenshots-laptop
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: webapp/frontend/screenshots
          retention-days: 14
          if-no-files-found: ignore
      - name: Lighthouse mobile budget (accessibility, best practices, page weight)
        working-directory: webapp/frontend
        run: |
          export CHROME_PATH=$(node -e "console.log(require('playwright').chromium.executablePath())")
          npx --yes @lhci/cli@0.14.0 autorun
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: webapp/frontend/playwright-report
          retention-days: 7
      - name: Logs on failure
        if: failure()
        run: tail -n 100 /tmp/backend.log /tmp/frontend.log
